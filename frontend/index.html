<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Bosque's --color-sidebar, the shell's top bar; applyTheme (src/theme.ts) follows the gym's theme. -->
    <meta name="theme-color" content="#0f2e1b" />
    <title>Rakin</title>
    <!-- Rakin's icons, built by docs/brand/build.py (#224). The .ico first: a browser
         that takes the SVG prefers it whatever the order, one that does not stops here. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Link previews of rakin.app. Crawlers want an absolute image URL. -->
    <meta name="description" content="Membresías y pagos para academias." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rakin" />
    <meta property="og:title" content="Rakin" />
    <meta property="og:description" content="Membresías y pagos para academias." />
    <meta property="og:image" content="https://rakin.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="El logo de Rakin: cuatro tatamis alrededor de un cuadrado." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
