# Single-node Garage for the `selfhost` profile: S3-compatible storage for
# proof images. Secrets come from the environment (GARAGE_RPC_SECRET), never
# from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# One node, so one copy of each object.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
