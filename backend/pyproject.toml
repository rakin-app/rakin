[project]
name = "rakin-api"
version = "0.1.0"
description = "Rakin API: membership and fee tracking for martial-arts gyms"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.126",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sentry-sdk>=2.74.0",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.126",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
# asyncpg ships no type information; the migration tests use it directly.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a reachable Postgres at TEST_DATABASE_URL",
    "s3: needs a reachable S3-compatible server at TEST_S3_ENDPOINT_URL",
]
filterwarnings = [
    "error",
    # Starlette's TestClient nudges towards a separate client package; httpx works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
