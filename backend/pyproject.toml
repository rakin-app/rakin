[project]
name = "rakin-api"
version = "0.1.0"
description = "Rakin API: membership and fee tracking for martial-arts gyms"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
# asyncpg ships no type information; the migration tests use it directly.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a reachable Postgres at TEST_DATABASE_URL"]
filterwarnings = [
    "error",
    # Starlette's TestClient nudges towards a separate client package; httpx works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
