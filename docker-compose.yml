# Local dev stack. See README "Run locally".
#
#   docker compose up                     # caddy, api, jobs, postgres (+ the Vite dev server)
#   docker compose --profile selfhost up  # also Garage, for self-hosters without S3
#
# Every value below has a local default, so this runs without a `.env`;
# copy `.env.example` to `.env` to override any of them.

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # Inside the network Postgres is `postgres`, not the host's `localhost`.
    # The users are the `.env.example` ones that `migrate` bootstraps.
    DATABASE_URL: postgresql+asyncpg://rakin_api:rakin_api@postgres:5432/${POSTGRES_DB:-rakin}
    MIGRATION_DATABASE_URL: postgresql+asyncpg://rakin_owner:rakin_owner@postgres:5432/${POSTGRES_DB:-rakin}
    # Object storage for the BlobStore; these point at the `selfhost` Garage.
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://localhost:3900}
    S3_REGION: ${S3_REGION:-garage}
    S3_BUCKET: ${S3_BUCKET:-rakin}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GKd06e218c3fa3bb3f69e9d09e}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-af635cf10ca8d78993f886624767e63600cb52fa8e7730c15d026ace93a3f341}
  volumes:
    - ./backend:/srv

services:
  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

  # Vite dev server with HMR; reached through caddy, not published.
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      RAKIN_API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

  # One-shot, as in production: create the database roles with the
  # superuser (safe to re-run), then run forward-only migrations as the owner.
  # Only this container ever sees the superuser's credentials.
  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      BOOTSTRAP_DATABASE_URL: postgresql://${POSTGRES_USER:-rakin}:${POSTGRES_PASSWORD:-rakin}@postgres:5432/${POSTGRES_DB:-rakin}
    command: ["sh", "-c", "python -m app.db_bootstrap \"$$BOOTSTRAP_DATABASE_URL\" && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
      # Docker Desktop (macOS, Windows) does not pass host file events into
      # containers, so --reload has to poll.
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs (reminders, nightly reconciliation). There is no job
  # runner yet, so this only keeps the service slot in place.
  jobs:
    <<: *backend
    command: ["sh", "-c", "echo 'no jobs registered yet; idling' && exec sleep infinity"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakin}
      POSTGRES_DB: ${POSTGRES_DB:-rakin}
    # Published so host-run tools (`uv run pytest -m postgres`, psql) can reach it.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage for self-hosters; hosted uses a real S3 provider.
  garage:
    image: dxflrs/garage:v2.5.0
    profiles: ["selfhost"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-57d9a189650872044edafa9a57fe77e8180e79f7979e4ea6a6d3e86d67297576}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # One-shot: layout, bucket and the api's key. Safe to re-run.
  garage-init:
    build: ./garage
    profiles: ["selfhost"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-57d9a189650872044edafa9a57fe77e8180e79f7979e4ea6a6d3e86d67297576}
      S3_BUCKET: ${S3_BUCKET:-rakin}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GKd06e218c3fa3bb3f69e9d09e}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-af635cf10ca8d78993f886624767e63600cb52fa8e7730c15d026ace93a3f341}
    volumes:
      # Read-only: the CLI only needs the node key to find and reach the daemon.
      - garage_meta:/var/lib/garage/meta:ro
    depends_on:
      - garage

volumes:
  caddy_data:
  pg_data:
  garage_meta:
  garage_data:
  web_node_modules:
