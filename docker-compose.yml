# Local dev stack. See README "Run locally".
#
#   docker compose up                     # caddy, api, jobs, postgres (+ the Vite dev server)
#   docker compose --profile selfhost up  # also minio, for self-hosters without S3
#
# Every value below has a local default, so this runs without a `.env`;
# copy `.env.example` to `.env` to override any of them.

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # Inside the network Postgres is `postgres`, not the host's `localhost`.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rakin}:${POSTGRES_PASSWORD:-rakin}@postgres:5432/${POSTGRES_DB:-rakin}
  volumes:
    - ./backend:/srv

services:
  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

  # Vite dev server with HMR; reached through caddy, not published.
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      RAKIN_API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

  # Forward-only migrations as a one-shot container, as in production.
  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
      # Docker Desktop (macOS, Windows) does not pass host file events into
      # containers, so --reload has to poll.
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs (reminders, nightly reconciliation). There is no job
  # runner yet, so this only keeps the service slot in place.
  jobs:
    <<: *backend
    command: ["sh", "-c", "echo 'no jobs registered yet; idling' && exec sleep infinity"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakin}
      POSTGRES_DB: ${POSTGRES_DB:-rakin}
    # Published so host-run tools (`uv run pytest -m postgres`, psql) can reach it.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio
    profiles: ["selfhost"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rakin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rakinrakin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  caddy_data:
  pg_data:
  minio_data:
  web_node_modules:
