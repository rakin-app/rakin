# Local dev stack. See README "Run locally".
#
#   docker compose up                     # caddy, api, jobs, postgres (+ the Vite dev server)
#   docker compose --profile selfhost up  # also Garage, for self-hosters without S3
#
# Every value below has a local default, so this runs without a `.env`;
# copy `.env.example` to `.env` to override any of them. `.env` is only read
# for the interpolations here: each container gets exactly the variables it
# lists, so the Postgres superuser never reaches `api` or `jobs`.

x-backend: &backend
  build: ./backend
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-local}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    HEALTHZ_DB_TIMEOUT_SECONDS: ${HEALTHZ_DB_TIMEOUT_SECONDS:-2.0}
    # Inside the network Postgres is `postgres`, not the host's `localhost`.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_API_USER:-rakin_api}:${POSTGRES_API_PASSWORD:-rakin_api}@postgres:5432/${POSTGRES_DB:-rakin}
    MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_OWNER_USER:-rakin_owner}:${POSTGRES_OWNER_PASSWORD:-rakin_owner}@postgres:5432/${POSTGRES_DB:-rakin}
    # Object storage for the BlobStore: server-side calls use the internal
    # endpoint, presigned URLs the one the browser can reach.
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:3900}
    S3_REGION: ${S3_REGION:-garage}
    S3_BUCKET: ${S3_BUCKET:-rakin}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GKd06e218c3fa3bb3f69e9d09e}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-af635cf10ca8d78993f886624767e63600cb52fa8e7730c15d026ace93a3f341}
  volumes:
    - ./backend:/srv

services:
  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    # Wait for both upstreams, so the first page load is not a 502.
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # Vite dev server with HMR; reached through caddy, not published.
  web:
    image: node:24.22.2-alpine
    working_dir: /app
    # `npm ci` only when the lockfile changed since the last install; `exec`
    # so Vite gets the stop signal directly.
    command:
      - sh
      - -c
      - >-
        cmp -s package-lock.json node_modules/.compose-lock
        || { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.compose-lock; }
        && exec node_modules/.bin/vite --host 0.0.0.0
    environment:
      RAKIN_API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 5s
      retries: 15
      # The first start installs packages.
      start_period: 5m
      start_interval: 2s

  # One-shot, as in production: create the database roles with the
  # superuser (safe to re-run; it also resets their passwords), then run
  # forward-only migrations as the owner. Only this container sees the
  # superuser, as libpq PG* variables rather than a URL.
  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-rakin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rakin}
      PGDATABASE: ${POSTGRES_DB:-rakin}
    command: ["sh", "-c", "python -m app.db_bootstrap && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
      # Docker Desktop (macOS, Windows) does not pass host file events into
      # containers, so --reload has to poll.
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs (reminders, nightly reconciliation). There is no job
  # runner yet, so this only keeps the service slot in place.
  jobs:
    <<: *backend
    command: ["sh", "-c", "echo 'no jobs registered yet; idling' && exec sleep infinity"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakin}
      POSTGRES_DB: ${POSTGRES_DB:-rakin}
    # Published so host-run tools (`uv run pytest -m postgres`, psql) can reach it.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage for self-hosters; hosted uses a real S3 provider.
  garage:
    image: dxflrs/garage:v2.5.0
    profiles: ["selfhost"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-57d9a189650872044edafa9a57fe77e8180e79f7979e4ea6a6d3e86d67297576}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # One-shot: layout, bucket and the api's key. Safe to re-run.
  garage-init:
    build: ./garage
    profiles: ["selfhost"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-57d9a189650872044edafa9a57fe77e8180e79f7979e4ea6a6d3e86d67297576}
      S3_BUCKET: ${S3_BUCKET:-rakin}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GKd06e218c3fa3bb3f69e9d09e}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-af635cf10ca8d78993f886624767e63600cb52fa8e7730c15d026ace93a3f341}
    volumes:
      # Read-only: the CLI only needs the node key to find and reach the daemon.
      - garage_meta:/var/lib/garage/meta:ro
    depends_on:
      - garage

volumes:
  caddy_data:
  pg_data:
  garage_meta:
  garage_data:
  web_node_modules:
