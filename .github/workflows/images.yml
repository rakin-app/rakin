name: images

# One pair of images per commit on `main`, pushed to GHCR:
#   ghcr.io/rakin-app/rakin-api   api, jobs and the one-shot migrate (backend/Dockerfile)
#   ghcr.io/rakin-app/rakin-web   the built SPA behind Caddy (deploy/web.Dockerfile)
# each tagged `sha-<full commit sha>` and `main`. A release never rebuilds:
# deploy.yml gives these images the release tag. See docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: rakin-api
            context: backend
            file: backend/Dockerfile
          - image: rakin-web
            context: .
            file: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rakin-app/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
