name: deploy

# A release: push a signed `v*` tag on a commit of `main`. Then, in order:
#   release     gives that commit's images (built by images.yml) the tag;
#   staging     deploys it to the staging host and checks it (deploy-host.yml);
#   changes     writes the job summary the owner reads before approving: the
#               tag's notes, the commits and migrations since production's tag;
#   production  waits for the owner's approval (the `production` environment's
#               required reviewer), backs up, deploys and checks.
# Production is only offered for a tag that passed on staging.
#
# By hand (workflow_dispatch): a tag, `rollback` (restart only, no migrations,
# no backup) and `target`. A forward deploy always goes through staging, so
# `target: production` is refused unless `rollback` is ticked. See
# docs/deploy.md.
#
# Each environment holds its own secrets (DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS) and variables (DEPLOY_URL, DEPLOY_DIR);
# none at repository level, since an environment missing one would fall back
# to it. While an environment's host secrets are unset its job passes without
# deploying.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to run (an existing v* tag)
        required: true
      rollback:
        description: Roll back to it (restart only, no migrations)
        type: boolean
        default: false
      target:
        description: Where (production alone only with rollback)
        type: choice
        options: [both, staging, production]
        default: both

# The changes job reads production's tag back from this: "<verb> <tag> ...".
run-name: ${{ inputs.rollback && 'rollback' || 'deploy' }} ${{ inputs.tag || github.ref_name }} to ${{ inputs.target || 'both' }}

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ env.TAG }}
    steps:
      - name: Check the tag and the target
        env:
          TARGET: ${{ inputs.target }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          [[ $TAG =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "::error::'$TAG' is not a v* tag"; exit 1; }
          if [ "$TARGET" = production ] && [ "$ROLLBACK" != true ]; then
            echo "::error::a deploy to production goes through staging first: use target both, or tick rollback"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Find the commit
        id: commit
        run: |
          sha=$(git rev-parse 'HEAD^{commit}')
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$TAG ($sha) is not on main, so images.yml never built it"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the commit's images
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for image in rakin-api rakin-web; do
            source=ghcr.io/rakin-app/$image:sha-$SHA
            # A tag pushed right after its merge can beat images.yml here.
            for _ in $(seq 40); do
              docker buildx imagetools inspect "$source" >/dev/null 2>&1 && break
              echo "waiting for $source"
              sleep 30
            done
            docker buildx imagetools create -t "ghcr.io/rakin-app/$image:$TAG" "$source"
          done

  staging:
    needs: release
    if: inputs.target != 'production'
    permissions:
      contents: read
      packages: read
    # One deploy per host at a time, and never cancel one halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-host.yml
    with:
      environment: staging
      url: https://staging.rakin.app
      tag: ${{ needs.release.outputs.tag }}
      rollback: ${{ inputs.rollback == true }}
    secrets: inherit

  # No environment and no secrets: it only reads the repository, so it runs
  # before the approval and its summary is on the page the owner approves from.
  changes:
    needs: [release, staging]
    if: >-
      always() && needs.release.result == 'success' && inputs.target != 'staging' &&
      (needs.staging.result == 'success' ||
       (needs.staging.result == 'skipped' && inputs.target == 'production' && inputs.rollback))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Checking out a tag can leave it lightweight; fetch them all as they are.
      - run: git fetch --force --tags origin
      - name: Find what production runs
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest successful production deployment, and the tag its run
          # deployed (from the run-name: a dispatch's ref is a branch).
          previous=
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30" --jq '.[].id'); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" \
              --jq '.[0] | "\(.state) \(.log_url // .target_url // "")"')
            [ "${status%% *}" = success ] || continue
            run=$(sed -n 's#.*/actions/runs/\([0-9][0-9]*\).*#\1#p' <<<"$status")
            [ -n "$run" ] || continue
            candidate=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.display_title' | awk '{ print $2 }')
            if [[ $candidate =~ ^v[0-9A-Za-z._-]+$ ]]; then previous=$candidate; break; fi
          done
          echo "previous=$previous" >>"$GITHUB_OUTPUT"
      - name: Write the summary
        env:
          PREVIOUS: ${{ steps.previous.outputs.previous }}
          ROLLBACK: ${{ inputs.rollback && '--rollback' || '' }}
        run: |
          # shellcheck disable=SC2086  # ROLLBACK is empty or one word
          .github/scripts/release-changes.sh $ROLLBACK "$TAG" $PREVIOUS | tee -a "$GITHUB_STEP_SUMMARY"

  production:
    needs: [release, staging, changes]
    if: always() && needs.changes.result == 'success'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-host.yml
    with:
      environment: production
      url: https://app.rakin.app
      tag: ${{ needs.release.outputs.tag }}
      rollback: ${{ inputs.rollback == true }}
      # A rollback migrates nothing, so it takes no backup.
      backup: ${{ inputs.rollback != true }}
    secrets: inherit
