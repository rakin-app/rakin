name: ci

# No path filters: `backend`, `frontend` and `dco` are required checks on `main`,
# and a required check that never runs leaves the PR blocked.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rakin
          POSTGRES_PASSWORD: rakin
          POSTGRES_DB: rakin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rakin -d rakin"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ENVIRONMENT: test
      # `DATABASE_URL` and `MIGRATION_DATABASE_URL` keep their defaults: the API and
      # owner users that `app.db_bootstrap` creates. `rakin` is the superuser.
      TEST_DATABASE_URL: postgresql+asyncpg://rakin:rakin@localhost:5432/rakin
      # A `postgres` test that skips here would pass CI without touching the database.
      REQUIRE_POSTGRES: '1'
      # The S3 BlobStore's contract tests, against the Garage that `garage-init` starts.
      TEST_S3_ENDPOINT_URL: http://localhost:3900
      REQUIRE_S3: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag upstream
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m app.db_bootstrap postgresql://rakin:rakin@localhost:5432/rakin
      - run: uv run alembic upgrade head
      # The self-host profile's Garage and its bootstrap (layout, key, bucket), as-is.
      - run: docker compose --profile selfhost run --rm garage-init
        working-directory: .
      - run: uv run pytest

  # The backend suite at 00:30 UTC, when a UTC host's date is a day ahead of the
  # gym's (America/Santiago): a test that takes the host's date fails here at any
  # hour, not only from 00:00 UTC (#122). libfaketime moves Postgres and pytest by
  # one offset, so the API's `now() AT TIME ZONE` and Python's clock still agree.
  # No Garage: S3 signatures would be minutes or hours off its real clock, so the
  # `s3` tests skip.
  backend-midnight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TZ: UTC
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://rakin:rakin@localhost:5432/rakin
      REQUIRE_POSTGRES: '1'
      FAKETIME_DONT_FAKE_MONOTONIC: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: sudo apt-get update -q && sudo apt-get install -y -q faketime
      # Seconds from now to today's 00:30 UTC, signed as libfaketime wants it.
      - run: >-
          echo "FAKE_OFFSET=$(printf '%+d' $(( $(date -ud '00:30' +%s) - $(date +%s) )))"
          >> "$GITHUB_ENV"
      - name: Postgres on the faked clock
        run: |
          docker build -q -t postgres-faketime - <<'DOCKERFILE'
          FROM postgres:18
          RUN apt-get update && apt-get install -y --no-install-recommends faketime \
            && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker run -d --name postgres -p 5432:5432 \
            -e TZ -e FAKETIME_DONT_FAKE_MONOTONIC \
            -e POSTGRES_USER=rakin -e POSTGRES_PASSWORD=rakin -e POSTGRES_DB=rakin \
            --entrypoint faketime postgres-faketime -f "$FAKE_OFFSET" docker-entrypoint.sh postgres
          # Not `pg_isready` over the socket: the entrypoint's init-phase server answers
          # it before `POSTGRES_DB` exists, then restarts (#125). That server listens on
          # no TCP port, so a query over TCP only succeeds on the final one.
          timeout 60 sh -c 'until docker exec -e PGPASSWORD=rakin postgres \
            psql -h 127.0.0.1 -U rakin -d rakin -Atqc "SELECT 1" >/dev/null 2>&1; do sleep 1; done'
      # Both clocks read 00:3x UTC, and the gym's date is the day before the host's.
      - run: |
          docker exec postgres psql -U rakin -d rakin -Atc \
            "SELECT now(), (now() AT TIME ZONE 'America/Santiago')::date"
          faketime -f "$FAKE_OFFSET" uv run python -c '
          from datetime import UTC, date, datetime
          from app.domain.dates import gym_today
          now = datetime.now(UTC)
          print(now, gym_today("America/Santiago"))
          assert now.hour == 0 and gym_today("America/Santiago") < date.today(), now'
      - run: uv run python -m app.db_bootstrap postgresql://rakin:rakin@localhost:5432/rakin
      - run: uv run alembic upgrade head
      - run: faketime -f "$FAKE_OFFSET" uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The hosted stack (deploy/): its scripts, and a boot of the images,
  # Caddyfile and Compose file a release would ship, from this commit.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh
      - run: deploy/test-deploy.sh
      - run: deploy/test-hosted.sh

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/test-check-dco.sh
      - run: >-
          .github/scripts/check-dco.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
